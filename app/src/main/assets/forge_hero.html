<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <script src="three_engine.js"></script>
  <script>
    var scene = new ShellCraftThreeScene(document.getElementById('scene'), {
      mode: 'forge',
      primary: '#A855F7',
      secondary: '#00E5FF',
      bg: '#0D1322'
    });
    window.setHeroState = function (stateName, primaryHex, secondaryHex, bgHex, speed, pulse) {
      scene.setState(primaryHex, secondaryHex, bgHex, speed, pulse);
    };
  </script>
</body>
</html>
